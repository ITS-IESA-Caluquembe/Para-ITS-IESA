<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITS IESA Caluquembe</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;margin:0;padding:15px}
h1{text-align:center;color:#facc15} .card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:0}
button{background:#22c55e;color:white;border:0;padding:12px;width:100%;border-radius:8px;font-weight:bold;margin-top:5px}
.item{background:white;color:black;padding:10px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between}
.top{display:flex;gap:10px;text-align:center}.top div{flex:1;background:#1e293b;padding:10px;border-radius:10px}
</style></head><body>
<h1>🎓 ITS IESA<br>Caluquembe</h1>
<div class="top"><div><h2 id="tA">0</h2>Alunos</div><div><h2 id="tP">0</h2>Professores</div><div><h2 id="tT">0</h2>Turmas</div></div>

<div class="card"><h3>➕ Adicionar Aluno</h3>
<input id="nomeA" placeholder="Nome do aluno">
<input id="turmaA" placeholder="Turma ex: 10ª A">
<input id="cursoA" placeholder="Curso ex: Informática">
<button onclick="addAluno()">Guardar Aluno</button>
<div id="listaA"></div></div>

<div class="card"><h3>👨‍🏫 Adicionar Professor</h3>
<input id="nomeP" placeholder="Nome do professor">
<input id="discP" placeholder="Disciplina ex: Matemática">
<button onclick="addProf()">Guardar Professor</button>
<div id="listaP"></div></div>

<script>
let alunos=JSON.parse(localStorage.getItem('alunos')||'[]');
let profs=JSON.parse(localStorage.getItem('profs')||'[]');
function show(){
document.getElementById('tA').innerText=alunos.length;
document.getElementById('tP').innerText=profs.length;
document.getElementById('listaA').innerHTML=alunos.map((a,i)=>`<div class="item"><span><b>${a.nome}</b><br>${a.turma} - ${a.curso}</span><span onclick="delA(${i})">❌</span></div>`).join('');
document.getElementById('listaP').innerHTML=profs.map((p,i)=>`<div class="item"><span><b>${p.nome}</b><br>${p.disc}</span><span onclick="delP(${i})">❌</span></div>`).join('');
}
function addAluno(){let n=nomeA.value,t=turmaA.value,c=cursoA.value;if(!n)return alert('Escreve o nome');alunos.push({nome:n,turma:t,curso:c});localStorage.setItem('alunos',JSON.stringify(alunos));nomeA.value='';turmaA.value='';cursoA.value='';show()}
function addProf(){let n=nomeP.value,d=discP.value;if(!n)return alert('Escreve o nome');profs.push({nome:n,disc:d});localStorage.setItem('profs',JSON.stringify(profs));nomeP.value='';discP.value='';show()}
function delA(i){alunos.splice(i,1);localStorage.setItem('alunos',JSON.stringify(alunos));show()}
function delP(i){profs.splice(i,1);localStorage.setItem('profs',JSON.stringify(profs));show()}
show();
</script></body></html>
